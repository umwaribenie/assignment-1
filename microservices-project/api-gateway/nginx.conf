events {
    worker_connections 1024;
}

http {
    upstream user_service {
        server user-service:8001;
    }

    upstream notification_service {
        server notification-service:8002;
    }

    server {
        listen 80;
        server_name localhost;

        # Logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # Health check endpoint
        location /health {
            add_header Content-Type application/json;
            return 200 '{"status": "healthy", "service": "api-gateway"}';
        }

        # User Service routes
        location /api/v1/auth {
            proxy_pass http://user_service/api/v1/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/users {
            proxy_pass http://user_service/api/v1/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Notification Service health check
        location /api/v1/notifications/health {
            proxy_pass http://notification_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default route
        location / {
            add_header Content-Type application/json;
            return 200 '{"message": "Welcome to the API Gateway", "version": "1.0.0"}';
        }

        # Error pages
        error_page 404 /404.json;
        location = /404.json {
            add_header Content-Type application/json;
            return 404 '{"error": "Not Found", "message": "The requested resource was not found"}';
        }

        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            add_header Content-Type application/json;
            return 500 '{"error": "Internal Server Error", "message": "Something went wrong"}';
        }
    }
}